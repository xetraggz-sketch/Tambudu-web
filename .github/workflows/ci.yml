name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tambudu
          POSTGRES_PASSWORD: tambudu
          POSTGRES_DB: tambudu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tambudu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://tambudu:tambudu@localhost:5432/tambudu_test
      NEXTAUTH_SECRET: ci-secret-not-real
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_EMAIL: admin@tambudu.ru
      ADMIN_PASSWORD: ci-password-123
      ADMIN_NAME: CI Admin
      NEXT_PUBLIC_DEFAULT_CITY: Самара
      NEXT_PUBLIC_API_BASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true # e2e tests are flaky in CI, don't block PR merge
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tambudu
          POSTGRES_PASSWORD: tambudu
          POSTGRES_DB: tambudu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tambudu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://tambudu:tambudu@localhost:5432/tambudu_test
      NEXTAUTH_SECRET: ci-secret-not-real
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: 'true'
      ADMIN_EMAIL: admin@tambudu.ru
      ADMIN_PASSWORD: ci-password-123
      ADMIN_NAME: CI Admin
      NEXT_PUBLIC_DEFAULT_CITY: Самара
      NEXT_PUBLIC_API_BASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run db:seed:events
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
