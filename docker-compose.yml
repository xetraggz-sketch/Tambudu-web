services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: tambudu
      POSTGRES_PASSWORD: tambudu
      POSTGRES_DB: tambudu
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tambudu -d tambudu']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
